<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Silly Duel</title>
<meta name="description" content="Quick silly games to decide who pays the bill. A 2 player duel with skins and levels.">
<meta name="theme-color" content="#ffd9ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/games2.css">
<link rel="stylesheet" href="css/games3.css">
  <link rel="stylesheet" href="css/arenas.css">
  <link rel="stylesheet" href="css/dock.css">
  <link rel="stylesheet" href="css/skins.css">
  <link rel="stylesheet" href="css/party.css">
</head>
<body>
<div id="app">
  <div class="bgfx" aria-hidden="true"></div>

  <main id="home" class="screen">
    <div class="topbar">
      <div class="coin-chip" id="coinChip" aria-label="Coins"></div>
      <button class="icon-btn" id="btnMusic" type="button" aria-label="Music" aria-pressed="true"></button>
      <button class="icon-btn" id="btnSfx" type="button" aria-label="Sound effects" aria-pressed="true"></button>
      <button class="icon-btn" id="btnVoice" type="button" aria-label="Funny voice" aria-pressed="true"></button>
      <button class="icon-btn" id="btnSettings" type="button" aria-label="Control settings"></button>
    </div>
    <h1 class="logo" aria-label="Silly Duel"><span>SILLY</span><span>DUEL</span></h1>
    <div class="duel" id="duel"></div>
    <div id="bossWrap"></div>
    <div class="modes" id="modes"></div>
    <p class="foot">2 players · one phone</p>
  </main>

  <main id="arena" class="screen" hidden data-count="2">
    <div id="pads"></div>
    <div id="center"><div id="centerInner"></div></div>
    <div id="goText" aria-hidden="true"></div>
    <div id="hud"><div id="timer"><i></i></div></div>
    <button class="icon-btn exit" id="btnExit" type="button" aria-label="Back to start" hidden></button>
  </main>

  <section id="ceremony" class="screen" hidden aria-live="polite">
    <div class="cere-card">
      <h2 id="cereTitle"></h2>
      <div class="cere-stage" id="cereStage"></div>
      <p id="cereLine"></p>
      <div id="cereXp" class="cere-xp"></div>
      <div class="cere-btns" id="cereBtns" hidden></div>
    </div>
  </section>

  <section id="offline" class="screen" hidden aria-label="Offline play">
    <div class="wd-card of-card">
      <h2>OFFLINE PLAY</h2>
      <div class="of-row" id="ofRow"></div>
      <div class="opp" id="ofOpp" role="radiogroup" aria-label="Player 2"></div>
      <p class="on-note">Tap a face or name to change it. Tap KEY to pick the key for that player.</p>
      <button class="gel" id="ofGo" type="button"><span>START</span></button>
      <button class="gel alt" id="ofBack" type="button"><span>BACK</span></button>
    </div>
  </section>

  <section id="arenas" class="screen" hidden aria-label="Arenas">
    <div class="wd-card pw-card-wrap">
      <h2>PLAY ROOMS</h2>
      <p class="on-note" id="arNote"></p>
      <div class="ar-grid" id="arGrid"></div>
      <button class="gel" id="arDone" type="button">DONE</button>
    </div>
  </section>

  <section id="powers" class="screen" hidden aria-label="Power-ups">
    <div class="wd-card pw-card-wrap">
      <h2>POWER-UPS</h2>
      <div class="pw-coins" id="pwCoins"></div>
      <p class="on-note" id="pwNote"></p>
      <div class="pw-grid" id="pwGrid"></div>
      <button class="gel" id="pwDone" type="button"><span>DONE</span></button>
    </div>
  </section>

  <div id="pick" hidden></div>

  <section id="settings" class="screen" hidden aria-label="Settings">
    <div class="wd-card st-card">
      <h2>MY CONTROLS</h2>
      <p class="on-note">Where should your side of the screen be?</p>
      <div class="st-group"><b>KEYS (PLAYER 1 / PLAYER 2)</b><div class="st-opts" id="stK"></div></div>
      <div class="st-group"><b>PHONE, UPRIGHT</b><div class="st-opts" id="stV"></div></div>
      <div class="st-group"><b>SIDEWAYS OR DESKTOP</b><div class="st-opts" id="stH"></div></div>
      <button class="gel alt" id="stAccount" type="button"><span>ACCOUNT / SIGN IN</span></button>
      <button class="gel" id="stDone" type="button">DONE</button>
    </div>
  </section>

  <section id="wardrobe" class="screen" hidden aria-label="Pick a look">
    <div class="wd-card">
      <h2 id="wdTitle">PICK A LOOK</h2>
      <div class="wd-preview" id="wdPrev"></div>
      <div class="wd-name" id="wdName"></div>
      <label class="wd-label" for="wdNameIn">NAME</label>
      <input id="wdNameIn" class="on-in wd-in" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <p class="on-note" id="wdNameNote"></p>
      <div class="wd-grid" id="wdGrid"></div>
      <div class="wd-buyrow" id="wdBuy"></div>
      <button class="gel" id="wdDone" type="button">DONE</button>
    </div>
  </section>

  <section id="simSearch" class="screen" hidden aria-label="Searching"></section>

  <section id="online" class="screen" hidden aria-label="Online">
    <div class="on-card" id="onCard"></div>
  </section>

  <section id="party" class="screen" hidden aria-label="Online">
    <div class="on-card" id="partyCard"></div>
  </section>

  <div id="tapStart" hidden><button class="gel" id="tapBtn" type="button"><span>TAP TO PLAY</span></button><p>SOUND ON</p></div>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="flash" aria-hidden="true"></div>
</div>

<script src="js/build.js"></script>
<script src="js/storage.js"></script>
<script src="js/fit.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/art.js"></script>
<script src="js/progress.js"></script>
<script src="js/powers.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/engine.js"></script>
<script src="js/games/freeze.js"></script>
<script src="js/games/dodge.js"></script>
<script src="js/games/beat.js"></script>
<script src="js/games/pinata.js"></script>
<script src="js/games/bomb.js"></script>
<script src="js/games/flap.js"></script>
<script src="js/games/hop.js"></script>
<script src="js/games/stack.js"></script>
<script src="js/games/balance.js"></script>
<script src="js/games/snack.js"></script>
<script src="js/games/knife.js"></script>
<script src="js/games/zigzag.js"></script>
<script src="js/games/skip.js"></script>
<script src="js/games/echo.js"></script>
<script src="js/games/lander.js"></script>
<script src="js/games/boss.js"></script>
<script src="js/pools.js"></script>
  <script src="js/arenas.js"></script>
<script src="js/net.js"></script>
<script src="js/lobby.js"></script>
<script src="js/server-config.js"></script>
<script src="js/party.js"></script>
<script src="js/main.js"></script>
</body>
</html>
